<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estação de Controle IoT</title>

  <!-- Tipografia moderna (Google Fonts). Se estiver offline, cai para a fonte do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- CSS servido pela pasta static/ do Flask (Jinja2) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <!-- Orbes decorativas de fundo -->
  <div class="orb orb--temp"></div>
  <div class="orb orb--hum"></div>

  <main class="app">
    <header>
      <div class="title">
        <h1>Estação de Controle</h1>
        <p>ESP32 · Monitoramento em tempo real</p>
      </div>
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">Conectando…</span>
      </div>
    </header>

    <section class="grid">
      <!-- Cartão: Temperatura -->
      <article class="card card--temp">
        <div class="card-top">
          <span class="label">Temperatura</span>
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
            </svg>
          </div>
        </div>
        <div class="value" id="tempValue"><span class="num">--.-</span><span class="unit">°C</span></div>

        <!-- Selo de estado + faixa ideal (preenchidos pelo JS a partir de LIMITS) -->
        <div class="meta">
          <span class="badge idle" id="tempBadge"><i class="b-dot"></i><span class="b-text">Aguardando</span></span>
          <span class="hint" id="tempHint"></span>
        </div>

        <div class="bar"><div class="bar-fill" id="tempBar"></div></div>
        <div class="scale"><span>-10°</span><span>20°</span><span>50°</span></div>
      </article>

      <!-- Cartão: Umidade -->
      <article class="card card--hum">
        <div class="card-top">
          <span class="label">Umidade</span>
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.7c-3.6 4.4-6 7.6-6 11a6 6 0 0 0 12 0c0-3.4-2.4-6.6-6-11z"/>
            </svg>
          </div>
        </div>
        <div class="value" id="humValue"><span class="num">--.-</span><span class="unit">%</span></div>

        <div class="meta">
          <span class="badge idle" id="humBadge"><i class="b-dot"></i><span class="b-text">Aguardando</span></span>
          <span class="hint" id="humHint"></span>
        </div>

        <div class="bar"><div class="bar-fill" id="humBar"></div></div>
        <div class="scale"><span>0%</span><span>50%</span><span>100%</span></div>
      </article>
    </section>

    <footer>
      <div class="last-update">
        <small>Última atualização</small>
        <strong id="lastUpdate">--:--:--</strong><span id="lastDate"></span>
      </div>

      <!-- Grupo de ações: "Sincronizar" é o botão principal; "Gerar Relatório" é secundário (.sync-btn--ghost) -->
      <div class="actions">
        <button class="sync-btn" id="syncBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-15.5-6.3L3 8"/><path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 15.5 6.3L21 16"/><path d="M21 21v-5h-5"/>
          </svg>
          <span id="syncLabel">Sincronizar Dados</span>
        </button>

        <button class="sync-btn sync-btn--ghost" id="reportBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>
          </svg>
          <span>Gerar Relatório</span>
        </button>
      </div>
    </footer>

    <div class="error" id="errorBox"></div>

    <!-- Créditos do criador -->
    <div class="credits">
      Desenvolvido por <strong>João Dias Stilben Teixeira</strong> · <a href="https://github.com/diasstilben" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>

  <!-- =========================================================
       MODAL DO RELATÓRIO
       O conteúdo (título, valores, estado) é preenchido pelo JS.
       ========================================================= -->
  <div class="modal-overlay" id="reportModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
      <div class="modal-icon" id="reportIcon"></div>
      <h2 id="reportTitle">Relatório</h2>
      <p class="modal-sub" id="reportSub"></p>

      <ul class="report-list" id="reportList"></ul>

      <small class="modal-time" id="reportTime"></small>
      <button class="modal-close" id="reportClose" type="button">Fechar</button>
    </div>
  </div>

  <!-- JS servido pela pasta static/ do Flask (Jinja2) -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
